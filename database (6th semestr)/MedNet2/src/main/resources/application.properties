spring.application.name=MedNet2
#spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/mednet?sslmode=disable&currentSchema=public
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:postgres}}}
spring.datasource.username=mednet_user
spring.datasource.password=mednet_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.schema=public
spring.data.jdbc.repositories.enabled=false

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173}
